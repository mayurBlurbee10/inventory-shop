# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - nu-wealth

on:
  push:
    branches:
      - nuwealth
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'
    env:
      BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID_MAIN }}
      BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET_MAIN }}
      BOX_ENTERPRISE_ID: ${{ secrets.BOX_ENTERPRISE_ID_MAIN }}
      BOX_PRIVATE_KEY: ${{ secrets.BOX_PRIVATE_KEY_MAIN }}
      BOX_PRIVATE_KEY_PASSWORD: ${{ secrets.BOX_PRIVATE_KEY_PASSWORD_MAIN }}
      BOX_PUBLIC_KEY_ID: ${{ secrets.BOX_PUBLIC_KEY_ID_MAIN }}
      BOX_DEVELOPER_TOKEN: ${{ secrets.BOX_DEVELOPER_TOKEN_MAIN }}
      BOX_PASSPHRASE: ${{ secrets.BOX_PASSPHRASE_MAIN }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_DATABASE: ${{ secrets.DB_DATABASE_MAIN }}
      NEXT_PUBLIC_APP_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_BASE_URL_NU_WEALTH }}
      NEXT_PUBLIC_JWT_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_JWT_SECRET_KEY }}
      AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
      AZURE_COMMUNICATION_SENDER_EMAIL: ${{ secrets.AZURE_COMMUNICATION_SENDER_EMAIL }} 
      NEXT_PUBLIC_OKTA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_OKTA_CLIENT_ID }} 
      NEXT_PUBLIC_OKTA_ISSUER: ${{ secrets.NEXT_PUBLIC_OKTA_ISSUER }} 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }} 
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL_NU_WEALTH }} 
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }} 

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_f8518164dfe64f5fb9a7f9e721b2792c }}
        password: ${{ secrets.AzureAppService_ContainerPassword_b0ea14c355954c45a1bf26215a37828c }}

    - name: Install dependencies
      run: |
        if [ -f yarn.lock ]; then
          yarn install;
        elif [ -f package-lock.json ]; then
          npm install --legacy-peer-deps;
        else
          echo "No lockfile found. Please check your dependencies.";
          exit 1;
        fi

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f8518164dfe64f5fb9a7f9e721b2792c }}/box-nu-wealth-app:${{ github.sha }}
        file: ./Dockerfile
        build-args: |
          BOX_CLIENT_ID=${{ secrets.BOX_CLIENT_ID_MAIN }}
          BOX_CLIENT_SECRET=${{ secrets.BOX_CLIENT_SECRET_MAIN }}
          BOX_ENTERPRISE_ID=${{ secrets.BOX_ENTERPRISE_ID_MAIN }}
          BOX_PRIVATE_KEY=${{ secrets.BOX_PRIVATE_KEY_MAIN }}
          BOX_PRIVATE_KEY_PASSWORD=${{ secrets.BOX_PRIVATE_KEY_PASSWORD_MAIN }}
          BOX_PUBLIC_KEY_ID=${{ secrets.BOX_PUBLIC_KEY_ID_MAIN }}
          BOX_DEVELOPER_TOKEN=${{ secrets.BOX_DEVELOPER_TOKEN_MAIN }}
          BOX_PASSPHRASE=${{ secrets.BOX_PASSPHRASE_MAIN }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SERVER=${{ secrets.DB_SERVER }}
          DB_DATABASE=${{ secrets.DB_DATABASE_MAIN }}
          NEXT_PUBLIC_APP_BASE_URL=${{ secrets.NEXT_PUBLIC_APP_BASE_URL_NU_WEALTH }}
          NEXT_PUBLIC_JWT_SECRET_KEY=${{ secrets.NEXT_PUBLIC_JWT_SECRET_KEY }}
          AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
          AZURE_COMMUNICATION_SENDER_EMAIL=${{ secrets.AZURE_COMMUNICATION_SENDER_EMAIL }}
          NEXT_PUBLIC_OKTA_CLIENT_ID=${{ secrets.NEXT_PUBLIC_OKTA_CLIENT_ID }} 
          NEXT_PUBLIC_OKTA_ISSUER=${{ secrets.NEXT_PUBLIC_OKTA_ISSUER }} 
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} 
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL_NU_WEALTH }} 
          AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'nu-wealth'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_1999974830a14d9f85ce3451c3dc5713 }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f8518164dfe64f5fb9a7f9e721b2792c }}/box-nu-wealth-app:${{ github.sha }}'