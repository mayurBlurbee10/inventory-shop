# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - universalportal-wealth

on:
  push:
    branches:
      - universalportal-wealth
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_6eacb970bdde47aa8dd49761d83173ea }}
        password: ${{ secrets.AzureAppService_ContainerPassword_bda72de990ca41f5b0de2d0e95f50bb0 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_6eacb970bdde47aa8dd49761d83173ea }}/box-universalportal-wealth-app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'universalportal-wealth'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_47b10fce5352495695777a04cbfb2700 }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_6eacb970bdde47aa8dd49761d83173ea }}/box-universalportal-wealth-app:${{ github.sha }}'