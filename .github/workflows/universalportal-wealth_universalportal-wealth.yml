# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - universalportal-wealth

on:
  push:
    branches:
      - universalportal-wealth
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Load all secrets from Azure Key Vault
        shell: bash
        run: |
          secrets=$(az keyvault secret list --vault-name mstrategy-keyvault --query "[].name" -o tsv)
          for secret in $secrets; do
            value=$(az keyvault secret show --vault-name mstrategy-keyvault --name "$secret" --query "value" -o tsv)
            var_name=$(echo "$secret" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
            echo "$var_name=$value" >> $GITHUB_ENV
          done

      - name: Set up Docker Buildx and login to ACR
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (Frontend)
        uses: docker/login-action@v3
        with:
          registry: universalportaldemo.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD }}

      - name: Build and push frontend container image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-app:${{ github.sha }}
          cache-from: type=registry,ref=universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-app:buildcache
          cache-to: type=registry,ref=universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-app:buildcache,mode=max
          build-args: |
            BOX_CLIENT_ID=${{ env.BOX_CLIENT_ID }}
            BOX_CLIENT_SECRET=${{ env.BOX_CLIENT_SECRET }}
            BOX_ENTERPRISE_ID=${{ env.BOX_ENTERPRISE_ID }}
            BOX_PRIVATE_KEY=${{ env.BOX_PRIVATE_KEY }}
            BOX_PRIVATE_KEY_PASSWORD=${{ env.BOX_PRIVATE_KEY_PASSWORD }}
            BOX_PUBLIC_KEY_ID=${{ env.BOX_PUBLIC_KEY_ID }}
            BOX_DEVELOPER_TOKEN=${{ env.BOX_DEVELOPER_TOKEN }}
            BOX_PASSPHRASE=${{ env.BOX_PASSPHRASE }}
            NEXT_PUBLIC_APP_BASE_URL=${{ env.NEXT_PUBLIC_APP_BASE_URL_UNIVERSALPORTAL_WEALTH }}
            NEXT_PUBLIC_JWT_SECRET_KEY=${{ env.NEXT_PUBLIC_JWT_SECRET_KEY }}
            AZURE_COMMUNICATION_CONNECTION_STRING=${{ env.AZURE_COMMUNICATION_CONNECTION_STRING }}
            AZURE_COMMUNICATION_SENDER_EMAIL=${{ env.AZURE_COMMUNICATION_SENDER_EMAIL }}
            NEXT_PUBLIC_OKTA_CLIENT_ID=${{ env.NEXT_PUBLIC_OKTA_CLIENT_ID }}
            NEXT_PUBLIC_OKTA_ISSUER=${{ env.NEXT_PUBLIC_OKTA_ISSUER }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL_UNIVERSALPORTAL_WEALTH }}
            AZURE_STORAGE_CONNECTION_STRING=${{ env.AZURE_STORAGE_CONNECTION_STRING }}
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL_UNIVERSALPORTAL_WEALTH }}
            NEXT_PUBLIC_CRYPTO_SECRET_KEY=${{ env.NEXT_PUBLIC_CRYPTO_SECRET_KEY }}
            ZENDESK_API_TOKEN=${{ env.ZENDESK_API_TOKEN }}
            ZENDESK_ADMIN_EMAIL=${{ env.ZENDESK_ADMIN_EMAIL }}
            ZENDESK_SUBDOMAIN_URL=${{ env.ZENDESK_SUBDOMAIN_URL }}

      - name: Deploy to Azure Web App (Frontend)
        id: deploy-frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: "universalportal-wealth"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_47b10fce5352495695777a04cbfb2700 }}
          images: "universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-app:${{ github.sha }}"

  build-and-deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    # Run in parallel with frontend (no dependency)

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Load all secrets from Azure Key Vault
        shell: bash
        run: |
          secrets=$(az keyvault secret list --vault-name mstrategy-keyvault --query "[].name" -o tsv)
          for secret in $secrets; do
            value=$(az keyvault secret show --vault-name mstrategy-keyvault --name "$secret" --query "value" -o tsv)
            var_name=$(echo "$secret" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
            echo "$var_name=$value" >> $GITHUB_ENV
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (Backend)
        uses: docker/login-action@v3
        with:
          registry: universalportaldemo.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-backend-app:${{ github.sha }}
          cache-from: type=registry,ref=universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-backend-app:buildcache
          cache-to: type=registry,ref=universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-backend-app:buildcache,mode=max
          build-args: |
            BOX_CLIENT_ID=${{ env.BOX_CLIENT_ID }}
            BOX_CLIENT_SECRET=${{ env.BOX_CLIENT_SECRET }}
            BOX_ENTERPRISE_ID=${{ env.BOX_ENTERPRISE_ID }}
            BOX_PRIVATE_KEY=${{ env.BOX_PRIVATE_KEY }}
            BOX_PRIVATE_KEY_PASSWORD=${{ env.BOX_PRIVATE_KEY_PASSWORD }}
            BOX_PUBLIC_KEY_ID=${{ env.BOX_PUBLIC_KEY_ID }}
            BOX_DEVELOPER_TOKEN=${{ env.BOX_DEVELOPER_TOKEN }}
            BOX_PASSPHRASE=${{ env.BOX_PASSPHRASE }}
            NEXT_PUBLIC_APP_BASE_URL=${{ env.NEXT_PUBLIC_APP_BASE_URL_UNIVERSALPORTAL_WEALTH }}
            NEXT_PUBLIC_JWT_SECRET_KEY=${{ env.NEXT_PUBLIC_JWT_SECRET_KEY }}
            AZURE_COMMUNICATION_CONNECTION_STRING=${{ env.AZURE_COMMUNICATION_CONNECTION_STRING }}
            AZURE_COMMUNICATION_SENDER_EMAIL=${{ env.AZURE_COMMUNICATION_SENDER_EMAIL }}
            NEXT_PUBLIC_OKTA_CLIENT_ID=${{ env.NEXT_PUBLIC_OKTA_CLIENT_ID }}
            NEXT_PUBLIC_OKTA_ISSUER=${{ env.NEXT_PUBLIC_OKTA_ISSUER }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL_UNIVERSALPORTAL_WEALTH }}
            AZURE_STORAGE_CONNECTION_STRING=${{ env.AZURE_STORAGE_CONNECTION_STRING }}
            NEXT_PUBLIC_CRYPTO_SECRET_KEY=${{ env.NEXT_PUBLIC_CRYPTO_SECRET_KEY }}
            ZENDESK_API_TOKEN=${{ env.ZENDESK_API_TOKEN }}
            ZENDESK_ADMIN_EMAIL=${{ env.ZENDESK_ADMIN_EMAIL }}
            ZENDESK_SUBDOMAIN_URL=${{ env.ZENDESK_SUBDOMAIN_URL }}

      - name: Deploy to Azure Web App (Backend)
        id: deploy-backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: "universalportal-wealth-backend"
          slot-name: "production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5253ED75F9E5473AA87C9B2D403A5083 }}
          images: "universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}/box-universalportal-wealth-backend-app:${{ github.sha }}"