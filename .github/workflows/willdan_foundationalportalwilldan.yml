# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - foundationalportalwilldan

on:
  push:
    branches:
      - willdan
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_53fb0989ef9e4724be13ebdedfb4e0c2 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_e94549df7b584f02b0827081f66e2f64 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_53fb0989ef9e4724be13ebdedfb4e0c2 }}/sha256:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'foundationalportalwilldan'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_7d8e6c85006040b5906abe6b031e58bb }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_53fb0989ef9e4724be13ebdedfb4e0c2 }}/sha256:${{ github.sha }}'