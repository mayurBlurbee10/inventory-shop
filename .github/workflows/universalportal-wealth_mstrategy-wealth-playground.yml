# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - mstrategy-wealth-playground

on:
  push:
    branches:
      - universalportal-wealth
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_101ce079324e4c3f9f5ff6764f2dbd8f }}
        password: ${{ secrets.AzureAppService_ContainerPassword_8b60888324814550b1c4cdf7e9d602c5 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_101ce079324e4c3f9f5ff6764f2dbd8f }}/universalportaldemo/box-universalportal-wealth-app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'mstrategy-wealth-playground'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_6bb1d56619504fbda487795f0bd58e25 }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_101ce079324e4c3f9f5ff6764f2dbd8f }}/universalportaldemo/box-universalportal-wealth-app:${{ github.sha }}'