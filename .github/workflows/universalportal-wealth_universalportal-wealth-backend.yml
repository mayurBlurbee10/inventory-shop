# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - universalportal-wealth-backend

on:
  push:
    branches:
      - universalportal-wealth
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: universalportaldemo.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2F76411CCB1D4DF1889A3C0A5D5EF928 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C4EDB83EF2EC427087534B23B7901AF0 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2F76411CCB1D4DF1889A3C0A5D5EF928 }}/box-universalportal-wealth-backend-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'universalportal-wealth-backend'
          slot-name: 'Production'
          images: 'universalportaldemo.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2F76411CCB1D4DF1889A3C0A5D5EF928 }}/box-universalportal-wealth-backend-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_409479AB7F9D439CBD4FD295ADD2040F }}