# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - boxpartnerapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'
    env:
      BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
      BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
      BOX_ENTERPRISE_ID: ${{ secrets.BOX_ENTERPRISE_ID }}
      BOX_PRIVATE_KEY: ${{ secrets.BOX_PRIVATE_KEY }}
      BOX_PRIVATE_KEY_PASSWORD: ${{ secrets.BOX_PRIVATE_KEY_PASSWORD }}
      BOX_PUBLIC_KEY_ID: ${{ secrets.BOX_PUBLIC_KEY_ID }}
      BOX_DEVELOPER_TOKEN: ${{ secrets.BOX_DEVELOPER_TOKEN }}
      BOX_PASSPHRASE: ${{ secrets.BOX_PASSPHRASE }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      NEXT_PUBLIC_APP_BASE_URL_MAIN: ${{ secrets.NEXT_PUBLIC_APP_BASE_URL_MAIN }}
      NEXT_PUBLIC_APP_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_BASE_URL }}

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_24f8d30e42c44892a7e231e272cf5577 }}

    - name: Install dependencies
      run: |
        if [ -f yarn.lock ]; then
          yarn install;
        elif [ -f package-lock.json ]; then
          npm install --legacy-peer-deps;
        else
          echo "No lockfile found. Please check your dependencies.";
          exit 1;
        fi
    
    - name: Set Environment Variables
        run: |
          echo "BOX_CLIENT_ID=${{ secrets.BOX_CLIENT_ID }}" >> $GITHUB_ENV
          echo "BOX_CLIENT_SECRET=${{ secrets.BOX_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "BOX_ENTERPRISE_ID=${{ secrets.BOX_ENTERPRISE_ID }}" >> $GITHUB_ENV
          echo "BOX_PRIVATE_KEY=${{ secrets.BOX_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "BOX_PRIVATE_KEY_PASSWORD=${{ secrets.BOX_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "BOX_DEVELOPER_TOKEN=${{ secrets.BOX_DEVELOPER_TOKEN }}" >> $GITHUB_ENV
          echo "BOX_PASSPHRASE=${{ secrets.BOX_PASSPHRASE }}" >> $GITHUB_ENV

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}/sha256:${{ github.sha }}
        file: ./Dockerfile
        build-args: |
          BOX_CLIENT_ID=${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET=${{ secrets.BOX_CLIENT_SECRET }}
          BOX_ENTERPRISE_ID=${{ secrets.BOX_ENTERPRISE_ID }}
          BOX_PRIVATE_KEY=${{ secrets.BOX_PRIVATE_KEY }}
          BOX_PRIVATE_KEY_PASSWORD=${{ secrets.BOX_PRIVATE_KEY_PASSWORD }}
          BOX_PUBLIC_KEY_ID=${{ secrets.BOX_PUBLIC_KEY_ID }}
          BOX_DEVELOPER_TOKEN=${{ secrets.BOX_DEVELOPER_TOKEN }}
          BOX_PASSPHRASE=${{ secrets.BOX_PASSPHRASE }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SERVER=${{ secrets.DB_SERVER }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          NEXT_PUBLIC_APP_BASE_URL_MAIN=${{ secrets.NEXT_PUBLIC_APP_BASE_URL_MAIN }}
          NEXT_PUBLIC_APP_BASE_URL=${{ secrets.NEXT_PUBLIC_APP_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'boxpartnerapp'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_47be3668c1c54ef5a7af575157613ab0 }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}/sha256:${{ github.sha }}'