# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - boxpartnerapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Load all secrets from Azure Key Vault
      shell: bash
      run: |
        secrets=$(az keyvault secret list --vault-name mstrategy-keyvault --query "[].name" -o tsv)
        for secret in $secrets; do
          value=$(az keyvault secret show --vault-name mstrategy-keyvault --name "$secret" --query "value" -o tsv)
          var_name=$(echo "$secret" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          echo "$var_name=$value" >> $GITHUB_ENV
        done

    - name: Print secrets frontend
      run: |
        echo "${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}"
        echo "${{ secrets.AzureAppService_ContainerPassword_24f8d30e42c44892a7e231e272cf5577 }}"
        echo "${{ secrets.AzureAppService_PublishProfile_47be3668c1c54ef5a7af575157613ab0 }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to ACR
      uses: docker/login-action@v2
      with:
        registry: https://universalportaldemo.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_24f8d30e42c44892a7e231e272cf5577 }}

    - name: Install dependencies
      run: |
        if [ -f yarn.lock ]; then
          yarn install;
        elif [ -f package-lock.json ]; then
          npm install --legacy-peer-deps;
        else
          echo "No lockfile found. Please check your dependencies.";
          exit 1;
        fi

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}/sha256:${{ github.sha }}
        file: ./Dockerfile
        build-args: |
          BOX_CLIENT_ID=${{ env.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET=${{ env.BOX_CLIENT_SECRET }}
          BOX_ENTERPRISE_ID=${{ env.BOX_ENTERPRISE_ID }}
          BOX_PRIVATE_KEY=${{ env.BOX_PRIVATE_KEY }}
          BOX_PRIVATE_KEY_PASSWORD=${{ env.BOX_PRIVATE_KEY_PASSWORD }}
          BOX_PUBLIC_KEY_ID=${{ env.BOX_PUBLIC_KEY_ID }}
          BOX_DEVELOPER_TOKEN=${{ env.BOX_DEVELOPER_TOKEN }}
          BOX_PASSPHRASE=${{ env.BOX_PASSPHRASE }}
          NEXT_PUBLIC_APP_BASE_URL=${{ env.NEXT_PUBLIC_APP_BASE_URL_MAIN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'boxpartnerapp'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_47be3668c1c54ef5a7af575157613ab0 }}
        images: 'universalportaldemo.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_f337580b331c4ad485d1195662e19231 }}/sha256:${{ github.sha }}'