version: '3'
services:
 box-wealth-portal-app:
    build: .
    container_name: box-wealth-portal-app
    ports:
      - "3003:3003"  # Host port 3000 mapped to container port 3000
    command: ["next", "start", "-H", "0.0.0.0", "-p", "3003"]  # Ensure it binds to 0.0.0.0 and uses port 3000
    environment:
      - NODE_ENV=production