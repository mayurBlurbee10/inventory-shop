version: '3'
services:
 box-universalportal-wealth-app:
    build: .
    container_name: box-universalportal-wealth-app
    ports:
      - "3008:3008"  # Host port 3008 mapped to container port 3008
    command: ["next", "start", "-H", "0.0.0.0", "-p", "3008"]  # Ensure it binds to 0.0.0.0 and uses port 3008
    environment:
      - NODE_ENV=production